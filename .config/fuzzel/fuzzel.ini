# =====================================
# fuzzel — App Launcher Config
# Gruvbox Hard Dark | No icons | Fast
# =====================================

[main]
font=Maple Mono:size=12
dpi-aware=auto
width=35                 # columns
horizontal-pad=12
vertical-pad=8
inner-pad=6
lines=12
tabs=4
prompt=❯
icons-enabled=yes
icon-theme=Papirus-Dark
terminal=ghostty -e
launch-prefix=
no-run-if-empty=yes
# exit-on-keyboard-focus-loss=yes   # uncomment if desired

[border]
width=2
radius=0                 # flat, no rounding

[dmenu]
# Used when called with --dmenu flag (e.g. cliphist)
exit-immediately-if-one-item=no
[colors]
background=1d2021ff
text=ebdbb2ff
match=fe8019ff
selection=3c3836ff
selection-text=fbf1c7ff
selection-match=fabd2fff
border=504945ff

