# =====================================
# hyprlock — Lock Screen
# Gruvbox Hard | Premium Style
# =====================================

source = $HOME/dotfiles/.config/hypr/configs/theme.conf

general {
    disable_loading_bar   = true
    hide_cursor           = true
    grace                 = 0
    no_fade_in            = false
    ignore_empty_input    = true
    immediate_render      = true
}

background {
    monitor =
    path    = screenshot
    color   = $bg0_hard
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0117
    contrast    = 0.8916
    brightness  = 0.8172
    vibrancy    = 0.1696
}

input-field {
    monitor =
    size    = 250, 50
    outline_thickness = 3
    dots_size         = 0.25
    dots_spacing      = 0.35
    dots_center       = true
    outer_color       = $bg2
    inner_color       = $bg1
    font_color        = $fg1
    fade_on_empty     = true
    fade_timeout      = 1000
    placeholder_text  = <span foreground="##$gray"><i>Password...</i></span>
    hide_input        = false
    rounding          = -1
    check_color       = $orange
    fail_color        = $red
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition   = 300

    position  = 0, -120
    halign    = center
    valign    = center
}

# Date
label {
    monitor =
    text    = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color   = $fg4
    font_size = 20
    font_family = Maple Mono

    position = 0, 80
    halign   = center
    valign   = center
}

# Time
label {
    monitor =
    text    = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color   = $fg0
    font_size = 96
    font_family = Maple Mono Bold

    position = 0, 180
    halign   = center
    valign   = center
}

# User Greeting
label {
    monitor =
    text    = Welcome back, $USER
    color   = $fg2
    font_size = 18
    font_family = Maple Mono

    position = 0, -40
    halign   = center
    valign   = center
}
