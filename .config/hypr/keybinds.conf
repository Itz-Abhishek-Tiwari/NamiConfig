#####################
### APP SHORTCUTS ###
#####################
$terminal = ghostty
$fileManager = dolphin
 
$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, exec, firefox
bind = $mainMod, L, exec, hyprlock
# bind = $mainMod, M, exec, spotify
bind = $mainMod, Q, killactive,
bind = $mainMod, SPACE, exec, pkill -x rofi || ~/.config/rofi/launcher/launcher.sh
bind = $mainMod, BACKSPACE,exec, pkill -x rofi || ~/.config/rofi/powermenu/powermenu.sh
bind = Ctrl+Alt, W, exec, killall waybar || waybar
bind = $mainMod, A, exec, waypaper
bind = $mainMod+Shift, T, exec, /home/abhishek/.config/scripts/mode_toggle.py
bind = $mainMod+Shift, F, exec, /home/abhishek/.config/scripts/focus_mode.py
# bind = , F9, exec, swaync-client -t

##################################
### WINDOW MANAGEMENT & FOCUS ###
##################################
bind = $mainMod, w, togglefloating,
bind = $mainMod, J, togglesplit,
bind = Alt, Return, fullscreen,

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize window
binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

################################
### WORKSPACES & SWITCHING  ###
################################
# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6a
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Silent move
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod+Alt, 0, movetoworkspacesilent, 10

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

#########################
### MEDIA CONTROLS #####
#########################
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##################################
### BRIGHTNESS & VOLUME KEYS  ###
##################################
# Using wpctl & brightnessctl
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Using custom scripts
bindl = , XF86MonBrightnessUp, exec, sh -c '/home/abhishek/.config/hypr/scripts/brightnesscontrol.sh -o i'
bindl = , XF86MonBrightnessDown, exec, sh -c '/home/abhishek/.config/hypr/scripts/brightnesscontrol.sh -o d'
bindl = , XF86AudioRaiseVolume, exec, sh -c '/home/abhishek/.config/hypr/scripts/volumecontrol.sh -o i'
bindl = , XF86AudioLowerVolume, exec, sh -c '/home/abhishek/.config/hypr/scripts/volumecontrol.sh -o d'
bindl = , XF86AudioMute, exec, sh -c '/home/abhishek/.config/hypr/scripts/volumecontrol.sh -o m'
bindl = , XF86AudioMicMute, exec, sh -c '/home/abhishek/.config/hypr/scripts/volumecontrol.sh -i m'

# Function key fallback
bindl  = , F10, exec, /home/abhishek/.config/hypr/scripts/volumecontrol.sh -o m
bindel = , F11, exec, /home/abhishek/.config/hypr/scripts/volumecontrol.sh -o d
bindel = , F12, exec, /home/abhishek/.config/hypr/scripts/volumecontrol.sh -o i
bind = , F1,  exec, sh -c '/home/abhishek/.config/hypr/scripts/brightnesscontrol.sh -o d'
bind = , F3,  exec, sh -c '/home/abhishek/.config/hypr/scripts/brightnesscontrol.sh -o i'

####################
### SCREENSHOTS ####
####################
bindl = $mainMod, P, exec, /home/abhishek/.config/hypr/scripts/screenshot.sh s
bindl = $mainMod+Ctrl, P, exec, /home/abhishek/.config/hypr/scripts/screenshot.sh sf
bindl = $mainMod+Alt, P, exec, /home/abhishek/.config/hypr/scripts/screenshot.sh m
bindl = , Print, exec, /home/abhishek/.config/hypr/scripts/screenshot.sh p

####################
### MOUSE BUTTONS ###
####################
bind = , mouse:275, exec, spotify       # side button up
bind = , mouse:276, exec, discord       # side button down

# Move focused window around the current workspace
bind = $mainMod+Shift+Ctrl, Left, movewindow, l
bind = $mainMod+Shift+Ctrl, Right, movewindow, r
bind = $mainMod+Shift+Ctrl, Up, movewindow, u
bind = $mainMod+Shift+Ctrl, Down, movewindow, d
####################################
### CLIPBOARD / UTILITIES SHORTCUTS
####################################
bind = SUPER+Shift, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy


bind = $mainMod+Alt, Left, exec, /home/abhishek/.config/scripts/change_wallpaper.py -p
bind = $mainMod+Alt, Right, exec, /home/abhishek/.config/scripts/change_wallpaper.py -0
bind = $mainMod+Alt, I, exec, /home/abhishek/.config/scripts/change_wallpaper.py -i

