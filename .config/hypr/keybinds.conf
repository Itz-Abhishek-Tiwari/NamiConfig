
###################
### KEYBINDINGS ###
###################
# Set programs that you use
$terminal = kitty
$fileManager = nautilus

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, w, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, SPACE, exec, pkill -x rofi ||  ~/.config/rofi/launcher/launcher.sh
bind = Ctrl+Alt, W, exec, killall waybar || waybar # toggle waybar
bind = $mainMod, F, exec, firefox
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, BACKSPACE,exec, pkill -x rofi || ~/.config/rofi/powermenu/powermenu.sh
bind = $mainMod, L, exec, hyprlock # launch lock screen

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6a
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = Alt, Return, fullscreen, # toggle the window between focus and fullscreen

# Resize windows
binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/Resize focused window
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# Move focused window to a workspace silently
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod+Alt, 0, movetoworkspacesilent, 10

# Brightness
bindl = , XF86MonBrightnessUp, exec, sh -c '/home/abhishek/.config/hypr/scripts/brightnesscontrol.sh -o i'
bindl = , XF86MonBrightnessDown, exec, sh -c '/home/abhishek/.config/hypr/scripts/brightnesscontrol.sh -o d'

# Volume (output)
bindl = , XF86AudioRaiseVolume, exec, sh -c '/home/abhishek/.config/hypr/scripts/volumecontrol.sh -o i'
bindl = , XF86AudioLowerVolume, exec, sh -c '/home/abhishek/.config/hypr/scripts/volumecontrol.sh -o d'
bindl = , XF86AudioMute, exec, sh -c '/home/abhishek/.config/hypr/scripts/volumecontrol.sh -o m'

# Mic (input)
bindl = , XF86AudioMicMute, exec, sh -c '/home/abhishek/.config/hypr/scripts/volumecontrol.sh -i m'



# Screenshot/Screencapture
bindl = $mainMod, P, exec, /home/abhishek/.config/hypr/scripts/screenshot.sh s # partial screenshot capture
bindl = $mainMod+Ctrl, P, exec, /home/abhishek/.config/hypr/scripts/screenshot.sh sf # partial screenshot capture (frozen screen)
bindl = $mainMod+Alt, P, exec, /home/abhishek/.config/hypr/scripts/screenshot.sh m # monitor screenshot capture
bindl = , Print, exec, /home/abhishek/.config/hypr/scripts/screenshot.sh p # all monitors screenshot capture



bindl  = , F10, exec, /home/abhishek/.config/hypr/scripts/volumecontrol.sh -o m # toggle audio mute
bindel = , F11, exec, /home/abhishek/.config/hypr/scripts/volumecontrol.sh -o d # decrease volume
bindel = , F12, exec, /home/abhishek/.config/hypr/scripts/volumecontrol.sh -o i # increase volume


bind = , F1,  exec, sh -c '/home/abhishek/.config/hypr/scripts/brightnesscontrol.sh -o d'
bind = , F3, exec, sh -c '/home/abhishek/.config/hypr/scripts/brightnesscontrol.sh -o i'

# side button upper
bind = , mouse:275, exec, spotify
# side button down
bind = , mouse:276, exec, discord

# wayTheme
bind = Ctrl+Shift, D, exec , '/home/abhishek/.config/hypr/scripts/wayBarThemeSwitch.py'
bind = $mainMod, A, exec,   waypaper
bind = SUPER+Shift, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
