############################
#       HYPRLAND.CONF       #
#   Source-only entrypoint  #
############################

# 0. Theme / Variables (Sourced first so other files can use $vars)
# 0. Theme / Variables (Sourced first so other files can use $vars)
source = $HOME/.config/hypr/conf/appearance.conf

# 1. Environment variables (Wayland, NVIDIA, Qt/GTK)
source = $HOME/.config/hypr/conf/env.conf

# 2. Display / monitor layout
source = $HOME/.config/hypr/conf/monitors.conf

# 3. Keyboard, touchpad, mouse
source = $HOME/.config/hypr/conf/input.conf

# 4. Layout, gaps, borders, render, misc
source = $HOME/.config/hypr/conf/general.conf

# 5. Animations (minimal)
source = $HOME/.config/hypr/conf/animations.conf

# 6. Window rules and floats
source = $HOME/.config/hypr/conf/windowrules.conf

# 7. All keybindings
source = $HOME/.config/hypr/conf/keybindings.conf

# 8. Startup applications
source = $HOME/.config/hypr/conf/startup.conf



