############################
#       HYPRLAND.CONF       #
#   Source-only entrypoint  #
############################

# 0. Theme / Variables (Sourced first so other files can use $vars)
source = ~/.config/hypr/configs/theme.conf

# 1. Environment variables (Wayland, NVIDIA, Qt/GTK)
source = ~/.config/hypr/configs/env.conf

# 2. Display / monitor layout
source = ~/.config/hypr/configs/monitors.conf

# 3. Keyboard, touchpad, mouse
source = ~/.config/hypr/configs/input.conf

# 4. Layout, gaps, borders, render, misc
source = ~/.config/hypr/configs/general.conf

# 5. Animations (minimal)
source = ~/.config/hypr/configs/animations.conf

# 6. Window rules and floats
source = ~/.config/hypr/configs/rules.conf

# 7. All keybindings
source = ~/.config/hypr/configs/keybinds.conf

# 8. Startup applications
source = ~/.config/hypr/configs/autostart.conf

