############################
#          SOURCES         #
############################

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitor.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/themes/catppuccin-mocha/theme.conf
source = ~/.config/hypr/themes/gtkTheme.conf


############################
#        ENVIRONMENT       #
############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


############################
#        AUTOSTART         #
############################

exec-once = waybar
exec-once = hyprpaper
exec-once = swayosd-server
exec-once = swaync
exec-once = waypaper --restore
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = hyprctl log -f > ~/.config/hypr/hyprland.log

# Clipboard persistence
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# PolicyKit agent
exec-once = systemctl --user start hyprpolkitagent

# System tray utilities
exec-once = blueman-applet
exec-once = nm-applet --indicator
exec-once = kdeconnect-indicator

# Daily planner (remove if not required)
exec-once = kitty -e glow /home/abhishek/day_plan.md


############################
#          LAYOUT          #
############################

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}


############################
#            MISC          #
############################

misc {
    disable_hyprland_logo = true
}


############################
#           INPUT          #
############################

input {
    kb_layout = us
    kb_options = ctrl:swap_lalt_lctl

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}


############################
#         GESTURES         #
############################

gesture = 3, horizontal, workspace


############################
#      DEVICE OVERRIDE     #
############################

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


############################
#           CURSOR         #
############################

cursor {
    # Keep true for NVIDIA setups
    no_hardware_cursors = true
}

