# =========================
# Window Rules (Hyprland)
# =========================

# Opacity rules - consolidated pattern matching
windowrule = opacity 0.90 0.90, match:class ^(Brave-browser|firefox)$
windowrule = opacity 0.90 0.90, match:class ^(code-oss|Code|code.*-handler)$
windowrule = opacity 0.90 0.90, match:class ^(kitty)$
windowrule = opacity 0.90 0.90, match:class ^(org\.(gnome\.Nautilus|kde\.(dolphin|ark|polkit-kde-authentication-agent-1)|pulseaudio\.pavucontrol|freedesktop\.impl\.portal\.desktop\.(gtk|hyprland)))$
windowrule = opacity 0.90 0.90, match:class ^(nwg-look|qt[56]ct|kvantummanager)$
windowrule = opacity 0.90 0.90, match:class ^(blueman-manager|nm-applet|nm-connection-editor|polkit-gnome-authentication-agent-1)$
windowrule = opacity 0.90 0.90, match:class ^([Ss]team|steamwebhelper)$
windowrule = opacity 0.90 0.90, match:class ^(Spotify)$
windowrule = opacity 0.90 0.90, match:initial_title ^(Spotify Free)$
windowrule = opacity 0.90 0.90, match:class ^(com\.(github\.(rafostar\.Clapper|tchx84\.Flatseal|unrud\.VideoDownloader)|obsproject\.Studio))$
windowrule = opacity 0.90 0.90, match:class ^(hu\.kramo\.Cartridges|gnome-boxes)$
windowrule = opacity 0.90 0.90, match:class ^(discord|WebCord|ArmCord)$
windowrule = opacity 0.90 0.90, match:class ^(app\.drey\.Warp|net\.davidotek\.pupgui2|yad|Signal)$
windowrule = opacity 0.90 0.90, match:class ^(io\.(github\.(alainm23\.planify|flattool\.Warehouse)|gitlab\.(theevilskeleton\.Upscaler|adhami3310\.Impression)|missioncenter\.MissionCenter))$

# Float rules - grouped by category

# Dolphin dialogs
windowrule = float on, match:class ^(org\.kde\.dolphin)$ match:title ^(Progress Dialog — Dolphin|Copying — Dolphin)$

# Firefox windows
windowrule = float on, match:class ^(firefox)$ match:title ^(Picture-in-Picture|Library)$

# Terminal monitors
windowrule = float on, match:class ^(kitty)$ match:title ^(top|btop|htop)$

# Settings/Configuration tools
windowrule = float on, match:class ^(kvantummanager|qt[56]ct|nwg-look|org\.kde\.ark|org\.pulseaudio\.pavucontrol|waypaper)$

# System utilities
windowrule = float on, match:class ^(vlc|blueman-manager|nm-applet|nm-connection-editor|org\.kde\.polkit-kde-authentication-agent-1)$

# GTK applications
windowrule = float on, match:class ^(Signal|com\.github\.rafostar\.Clapper|app\.drey\.Warp|net\.davidotek\.pupgui2|yad|eog)$
windowrule = float on, match:class ^(io\.(github\.alainm23\.planify|gitlab\.(theevilskeleton\.Upscaler|adhami3310\.Impression)|missioncenter\.MissionCenter))$
windowrule = float on, match:class ^(com\.github\.unrud\.VideoDownloader)$


# SwayNotificationCenter window rules
windowrule = float on, match:title ^(SwayNotificationCenter)$
windowrule = no_focus on, match:title ^(SwayNotificationCenter)$
windowrule = no_anim on, match:title ^(SwayNotificationCenter)$
windowrule = decorate off, match:title ^(SwayNotificationCenter)$
windowrule = opacity 0.1 override, match:title ^(SwayNotificationCenter)$

# =========================
# Layer Rules
# =========================

# Blur and transparency for overlays
layerrule = blur on, match:namespace ^(rofi|notifications|logout_dialog|swaync-.*)$
layerrule = blur_popups on, match:namespace ^(rofi|notifications|logout_dialog|swaync-.*)$
layerrule = ignore_alpha 0.5, match:namespace ^(rofi|notifications|swaync-.*)$

# Disabled blur
layerrule = blur on, match:namespace ^(waybar|zlaunch)$
layerrule = blur_popups on, match:namespace zlaunch
layerrule = ignore_alpha 0.35, match:namespace zlaunch



windowrule = opacity 1.0 override 1.0 override, match:class .*
