# =====================================================
# Modern Structured Window Rules (Wiki Update 2026)
# =====================================================

# --- Focus Management ---
windowrule {
    name = smart-inactive-dim
    match:focus = false
    opacity = 0.94
}

# --- Aesthetic Overrides ---
windowrule {
    name = terminal-transparency
    match:class = ^(kitty|Code|nwg-look|qt[56]ct|kvantummanager)$
    opacity = 0.90 0.90
}

windowrule {
    name = swaync-transparency
    match:title = ^(SwayNotificationCenter)$
    opacity = 0.1 override
}

# --- Floating Rules (Consolidated) ---
windowrule {
    name = dolphin-dialogs
    match:class = ^(org\.kde\.dolphin)$
    match:title = ^(Progress Dialog — Dolphin|Copying — Dolphin)$
    float = on
}

windowrule {
    name = firefox-utils
    match:class = ^(firefox)$
    match:title = ^(Picture-in-Picture|Library)$
    float = on
}

windowrule {
    name = system-tools-floating
    match:class = ^(kvantummanager|qt[56]ct|nwg-look|org\.kde\.ark|org\.pulseaudio\.pavucontrol|waypaper|vlc|blueman-manager|nm-applet|nm-connection-editor|org\.kde\.polkit-kde-authentication-agent-1|Signal|com\.github\.rafostar\.Clapper|app\.drey\.Warp|net\.davidotek\.pupgui2|yad|eog|com\.github\.unrud\.VideoDownloader|io\.(github\.alainm23\.planify|gitlab\.(theevilskeleton\.Upscaler|adhami3310\.Impression)|missioncenter\.MissionCenter))$
    float = on
}

windowrule {
    name = monitors-floating
    match:class = ^(kitty|ghostty)$
    match:title = ^(top|btop|htop)$
    float = on
}

windowrule {
    name = swaync-float
    match:title = ^(SwayNotificationCenter)$
    float = on
    no_anim = on
    no_focus = on
    decorate = off
}

# --- Layer Rules (New Syntax) ---
layerrule {
    name = bar-blur
    match:namespace = ^(waybar)$
    blur = on
    blur_popups = on
    ignore_alpha = 0.35
}

layerrule {
    name = menu-blur
    match:namespace = ^(rofi|notifications|logout_dialog|swaync-.*)$
    blur = on
    blur_popups = on
    ignore_alpha = 0.5
}


windowrule = opacity 1.0 override 1.0 override, match:class .*
