exec = gsettings set org.gnome.desktop.interface gtk-theme 'Wallbash-Gtk'
exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

general {
    col.active_border = rgba(EDD7D0ff) rgba(523329ff) 45deg
    col.inactive_border = rgba(132423ff) rgba(3B4738ff) 45deg
}

group {
    col.border_active = rgba(EDD7D0ff) rgba(523329ff) 45deg
    col.border_inactive = rgba(132423cc) rgba(3B4738cc) 45deg
    col.border_locked_active = rgba(FFFFFFff) rgba(050505ff) 45deg
    col.border_locked_inactive = rgba(FFFFFFcc) rgba(FFFFFFcc) 45deg
}
