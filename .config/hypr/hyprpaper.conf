# =====================================
# hyprpaper — Wallpaper Daemon
# =====================================

# Silence the ipc splash
splash = false

# Preload wallpapers (add your paths here)
# preload = /path/to/your/wallpaper.jpg

# Set wallpaper per monitor
# wallpaper = ,/path/to/your/wallpaper.jpg

# --- Solid Gruvbox Hard background (default) ---
# Uses a generated solid-color PNG. You can replace with any image.
# To generate a solid gruvbox bg: convert -size 1920x1080 xc:#1d2021 ~/.config/hypr/gruvbox-dark.png
preload = ~/.config/hypr/gruvbox-dark.png
wallpaper = ,~/.config/hypr/gruvbox-dark.png
