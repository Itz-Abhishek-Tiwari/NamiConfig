############################
#           INPUT           #
############################

input {
    kb_layout = us
    # kb_options = ctrl:swap_lalt_lctl

    repeat_rate  = 50
    repeat_delay = 300

    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll    = true
        tap-to-click      = true
        drag_lock         = false
        disable_while_typing = true
        scroll_factor     = 0.8
    }
}

# New v0.51+ Gesture System (Top-level command)
# fingers, direction, action, options
gesture = 3, horizontal, workspace
