############################
#       WINDOW RULES        #
############################

# --- Floats ---
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(nm-connection-editor)$
windowrule = float 1, match:class ^(blueman-manager)$
windowrule = float 1, match:class ^(waypaper)$
windowrule = float 1, match:class ^(org.gnome.Calculator)$
windowrule = float 1, match:class ^(file-roller)$
windowrule = float 1, match:class ^(org.kde.ark)$

# File pickers / xdg portals
windowrule = float 1, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float 1, match:title ^(Open File)$
windowrule = float 1, match:title ^(Save File)$
windowrule = float 1, match:title ^(Choose Files)$

# Authentication / polkit
windowrule = float 1, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = float 1, match:class ^(hyprpolkitagent)$

# Picture-in-Picture
windowrule = float 1,             match:title ^(Picture-in-Picture)$
windowrule = pin 1,               match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio 1, match:title ^(Picture-in-Picture)$

# --- Sizes for floats ---
windowrule = size 800 500, match:class ^(pavucontrol)$
windowrule = center 1,     match:class ^(pavucontrol)$
windowrule = size 700 450, match:class ^(nm-connection-editor)$
windowrule = center 1,     match:class ^(nm-connection-editor)$
windowrule = size 800 500, match:class ^(blueman-manager)$
windowrule = center 1,     match:class ^(blueman-manager)$
windowrule = size 850 600, match:class ^(waypaper)$
windowrule = center 1,     match:class ^(waypaper)$

# --- Workspace assignments ---
# windowrule = workspace 2 silent, match:class ^(firefox)$

# --- Idle inhibit ---
windowrule = idle_inhibit focus,      match:class ^(ghostty)$
windowrule = idle_inhibit fullscreen, match:class ^(firefox)$

# --- No shadows / blur everywhere (global) ---
windowrule = no_shadow 1, match:class (.*)

# --- Suppress maximize requests ---
# Note: suppress_event is used for specific xwayland/window events
windowrule = suppress_event maximize, match:class (.*)

# --- Fix Java/XWayland apps ---
windowrule = rounding 0, match:xwayland 1

# --- Tearing (wiki: allow_tearing master toggle + per-window `immediate` rule) ---
# Uncomment and adjust class for your games:
# windowrule = immediate, match:class ^(cs2)$
# windowrule = immediate, match:class ^(steam_app_.*)$
# windowrule = immediate, match:class ^(gamescope)$


