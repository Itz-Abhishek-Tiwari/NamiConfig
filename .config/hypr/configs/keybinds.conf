############################
#        KEYBINDINGS        #
#  Merged from NamiConfig   #
############################

# Main modifier key
$mainMod = SUPER

# Scripts path
$scrPath = ~/.local/bin

# Default applications
$terminal    = kitty
$fileManager = thunar
$launcher    = fuzzel
$browser     = firefox
$locker      = hyprlock
$notif       = swaync-client -t

####################
### APP SHORTCUTS ###
####################

bind = $mainMod,       T,         exec, $terminal
bind = $mainMod,       E,         exec, $fileManager
bind = $mainMod,       F,         exec, $browser
bind = $mainMod,       SPACE,     exec, fuzzel
bind = $mainMod,       L,         exec, $locker
bind = $mainMod,       N,         exec, $notif
bind = $mainMod SHIFT, T,         exec, /home/abhishek/.local/bin/theme-switch
bind = $mainMod ALT,   W,         exec, waypaper
bind = $mainMod,       Q,         killactive
bind = $mainMod SHIFT, Q,         exit
bind = $mainMod ALT,   P,         pseudo               # dwindle pseudotile

# Additional from NamiConfig
bind = Ctrl+Alt, W, exec, pkill waybar || waybar

##################################
### WINDOW MANAGEMENT & FOCUS ###
##################################

bind  = $mainMod,       W,         togglefloating
bind  = $mainMod,       M,         fullscreen, 0        # true fullscreen
bind  = $mainMod SHIFT, M,         fullscreen, 1        # maximize (no gaps)
bind  = $mainMod,       J,         layoutmsg, togglesplit # Fix for v0.54.1

# Focus with arrow keys or hjkl
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H,     movefocus, l
bind = $mainMod, L,     movefocus, r
bind = $mainMod, K,     movefocus, u
bind = $mainMod, J,     movefocus, d

# Move focused window
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize with SUPER+SHIFT+arrows (NamiConfig style)
binde = $mainMod SHIFT, right, resizeactive,  30  0
binde = $mainMod SHIFT, left,  resizeactive, -30  0
binde = $mainMod SHIFT, up,    resizeactive,   0 -30
binde = $mainMod SHIFT, down,  resizeactive,   0  30

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

############################
#   WORKSPACES (1–10)       #
############################

# Switch to workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace (follow window)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move window silently (don't follow)
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# Cycle workspaces with scroll wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Special (scratchpad) workspace
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

############################
#    MEDIA / SYSTEM KEYS    #
############################

# Volume
bindl = , XF86AudioRaiseVolume, exec, $scrPath/volume up
bindl = , XF86AudioLowerVolume, exec, $scrPath/volume down
bindl = , XF86AudioMute,        exec, $scrPath/volume mute
bindl = , XF86AudioMicMute,     exec, $scrPath/volume mic-mute

# Brightness
bindl = , XF86MonBrightnessUp,   exec, $scrPath/brightness up
bindl = , XF86MonBrightnessDown, exec, $scrPath/brightness down

# Media playback
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous

# Function key fallback
bindl  = , F10, exec, $scrPath/volume mute
bindel = , F11, exec, $scrPath/volume down
bindel = , F12, exec, $scrPath/volume up
bind = , F1,  exec, $scrPath/brightness down
bind = , F3,  exec, $scrPath/brightness up

############################
#       SCREENSHOTS         #
############################

bind = ,             Print,     exec, $scrPath/screenshot full
bind = $mainMod,     P,         exec, $scrPath/screenshot region
bind = $mainMod ALT, Print,     exec, $scrPath/screenshot window

############################
#        UTILITIES          #
############################

# Clipboard history (copy menu)
bind = $mainMod SHIFT, V, exec, cliphist list | fuzzel --dmenu -p "Copy " | cliphist decode | wl-copy

# Color picker (hyprpicker)
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Calculator (fuzzel-calc)
bind = $mainMod, C, exec, $scrPath/fuzzel-calc

# Power menu
bind = $mainMod SHIFT, P, exec, $scrPath/power-menu

# Reload Hyprland config
bind = $mainMod SHIFT, R, exec, hyprctl reload
