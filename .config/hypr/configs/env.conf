############################
# Wayland / Session Identity
############################

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = DESKTOP_SESSION,hyprland
env = PATH,$HOME/.local/bin:$PATH

############################
# Wayland Backends
# Wiki: GDK needs fallbacks (wayland,x11,*)
#       QT needs xcb fallback (wayland;xcb)
############################

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Wiki (Nvidia page): use `auto` not `wayland` — enables self-detection for
# Vesktop, VSCodium, Obsidian and other Electron/CEF apps
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Enable Wayland for Firefox
env = MOZ_ENABLE_WAYLAND,1

############################
# Qt Theming
############################

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

############################
# Cursor
############################

env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

############################
# NVIDIA (Hyprland wiki — official recommended vars only)
# Ryzen 4600H + GTX 1650 hybrid
############################

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
# VA-API backend — wiki recommends `direct` for nvidia-vaapi-driver
env = NVD_BACKEND,direct

# Hardware acceleration for Electron/Wayland
env = VDPAU_DRIVER,nvidia
env = LIBVA_MESSAGING_LEVEL,0

############################
# XWayland
############################

xwayland {
    force_zero_scaling = true
}
