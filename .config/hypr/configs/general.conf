############################
#          GENERAL          #
############################

general {
    # Gaps and borders
    gaps_in   = 5
    gaps_out  = 5
    border_size = 2

    # Colors come from theme.conf ($active_border, $inactive_border)
    col.active_border   = $active_border
    col.inactive_border = $inactive_border

    # Layout
    layout = dwindle

    # Resize on border drag
    resize_on_border = true
}

############################
#          DWINDLE          #
############################

dwindle {
    pseudotile     = true   # Toggle with SUPER + P
    preserve_split = true
    smart_split    = false
    smart_resizing = true
}

############################
#           MISC            #
############################

misc {
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    vfr = true            # Variable frame rate — saves GPU power on idle
    vrr = 1               # Variable refresh rate (adaptive sync)
    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true
    focus_on_activate       = false
}

############################
#          RENDER           #
############################

render {
    direct_scanout = true   # Bypass compositor in fullscreen — big perf win
}

############################
#      DECORATION           #
############################

decoration {
    rounding = 0            # Flat, no rounded corners

    shadow {
        enabled = false     # No shadows — saves GPU
    }

    blur {
        enabled = false     # No blur — saves GPU
    }
}

############################
#          CURSOR           #
############################

cursor {
    no_hardware_cursors = true  # Required for NVIDIA hybrid setups
}
