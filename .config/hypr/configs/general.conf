############################
#          GENERAL          #
############################

general {
    # Gaps and borders
    gaps_in   = 5
    gaps_out  = 5
    border_size = 2

    # Colors come from theme.conf ($active_border, $inactive_border)
    col.active_border   = $active_border
    col.inactive_border = $inactive_border

    # Layout
    layout = dwindle

    # Resize on border drag
    resize_on_border = true

    # Wiki (Tearing page): master toggle — required for per-window tearing rules
    # See rules.conf for per-game `immediate` rules
    allow_tearing = true
}

############################
#          DWINDLE          #
############################

dwindle {
    pseudotile     = true   # Toggle with SUPER + P
    preserve_split = true
    smart_split    = false
    smart_resizing = true
}

############################
#           MISC            #
############################

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true

    # Wiki (Performance page): "Heavily recommended" — reduces GPU work when idle
    vfr = true

    # Wiki (Variables — misc:vrr): 2 = fullscreen only; better for laptops than
    # always-on (1) to avoid VRR overhead on the composited desktop
    vrr = 2

    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true
    focus_on_activate       = false

    # Render unfocused windows at max 15 fps — saves GPU/battery
    render_unfocused_fps = 15
}

############################
#          RENDER           #
############################

render {
    # Wiki: triple-buffering when needed — improves FPS on underpowered devices
    new_render_scheduling = true
    direct_scanout = 1
}

############################
#          OPENGL           #
############################

opengl {
    # Wiki (Variables — opengl): reduces flickering on NVIDIA (ignored on non-nvidia)
    nvidia_anti_flicker = true
}

############################
#      DECORATION           #
############################

decoration {
    rounding = 0            # Flat, no rounded corners

    shadow {
        enabled = false     # No shadows — saves GPU
    }

    blur {
        enabled = false     # No blur — saves GPU
    }
}

############################
#          CURSOR           #
############################

cursor {
    # Wiki (Variables — cursor:no_hardware_cursors): int, not bool.
    # 2 = auto (disables hw cursors when tearing is active) — correct for NVIDIA hybrid
    no_hardware_cursors = 2

    # Wiki: use CPU buffer for HW cursors on NVIDIA — 2 = auto (nvidia only)
    use_cpu_buffer = 2
}
