############################
#        ANIMATIONS         #
# Minimal — productivity    #
# focused, no eye candy     #
############################

animations {
    enabled = true

    # ----- Bezier Curves (NamiConfig Style) -----
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1

    # ----- Windows -----
    # Using '2' for snappier feel
    animation = windows,     1, 2, softAcDecel, slide
    animation = windowsOut,  1, 2, easeOutExpo, slide
    animation = windowsMove, 1, 2, softAcDecel, slide

    # ----- Fade -----
    animation = fade,      1, 2, default

    # ----- Workspaces -----
    animation = workspaces, 1, 2, softAcDecel, slide

    # ----- Borders -----
    # Disabled — saves GPU cycles
    animation = border,      0
    animation = borderangle, 0
}
