############################
#         AUTOSTART         #
#  Keep this minimal for    #
#  performance & battery    #
############################

# --- Window Manager Utilities ---
exec-once = waybar
exec-once = swww-daemon
exec-once = waypaper --restore
exec-once = hypridle

# --- Notifications ---
exec-once = swaync

# --- Clipboard Manager ---
# cliphist stores clipboard history (text and images)
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- PolicyKit Agent ---
# Required for graphical privilege escalation (sudo in GUI apps)
exec-once = systemctl --user start hyprpolkitagent

# --- Network Applet ---
exec-once = nm-applet --indicator

# --- DBus / Systemd Environment ---
# Ensures portals and systemd services inherit correct Wayland env
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE



# --- Cursor ---
exec-once = hyprctl setcursor Adwaita 24

# --- Optional: uncomment as needed ---
exec-once = blueman-applet            # Bluetooth tray
exec-once = kdeconnect-indicator      # Phone sync
exec-once = /usr/lib/kdeconnectd      # KDE Connect daemon
