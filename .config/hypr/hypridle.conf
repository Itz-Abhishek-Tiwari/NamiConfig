# =====================================
# hypridle — Idle Daemon
# Aggressive power saving for laptop
# =====================================

general {
    lock_cmd         = pidof hyprlock || hyprlock  # Only launch if not running
    before_sleep_cmd = loginctl lock-session        # Lock before suspend
    after_sleep_cmd  = hyprctl dispatch dpms on     # Wake screen after resume
    ignore_dbus_inhibit = false
}

# 2 min   — Dim the screen (save backlight power)
listener {
    timeout  = 120
    on-timeout = brightnessctl -s set 20%    # save current, dim to 20%
    on-resume  = brightnessctl -r            # restore saved brightness
}

# 5 min   — Lock screen
listener {
    timeout  = 300
    on-timeout = loginctl lock-session
}

# 8 min   — Screen off (DPMS)
listener {
    timeout  = 480
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 15 min  — Suspend (biggest battery saver)
listener {
    timeout  = 900
    on-timeout = systemctl suspend
}
