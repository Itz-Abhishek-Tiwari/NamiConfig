# vim:ft=kitty

## name:     Gruvbox-Light
## author:   Converted from Catppuccin-Latte
## license:  MIT
## blurb:    Gruvbox light theme for Kitty

# The basic colors
foreground              #3C3836
background              #FBF1C7
selection_foreground    #FBF1C7
selection_background    #FABD2F

# Cursor colors
cursor                  #FABD2F
cursor_text_color       #3C3836

# URL underline color when hovering with mouse
url_color               #FABD2F

# Kitty window border colors
active_border_color     #FB4934
inactive_border_color   #A89984
bell_border_color       #B57614

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #3C3836
active_tab_background   #FB4934
inactive_tab_foreground #3C3836
inactive_tab_background #EDE6C7
tab_bar_background      #EBDBB2

# Colors for marks (marked text in the terminal)
mark1_foreground #3C3836
mark1_background #FB4934
mark2_foreground #3C3836
mark2_background #B8BB26
mark3_foreground #3C3836
mark3_background #83A598

# The 16 terminal colors

# black
color0 #3C3836
color8 #7C6F64

# red
color1 #FB4934
color9 #FB4934

# green
color2 #B8BB26
color10 #B8BB26

# yellow
color3 #FABD2F
color11 #FABD2F

# blue
color4 #83A598
color12 #83A598

# magenta
color5 #D3869B
color13 #D3869B

# cyan
color6 #8EC07C
color14 #8EC07C

# white
color7 #EBDBB2
color15 #FBF1C7
