## blurb:    Soothing teal/cyan theme with soft contrasts.

# The basic colors
foreground              #C0F0ED
background              #0F1117
selection_foreground    #0F1117
selection_background    #1ABC9C

# Cursor colors
cursor                  #1ABC9C
cursor_text_color       #0F1117

# URL underline color when hovering with mouse
url_color               #1ABC9C

# Kitty window border colors
active_border_color     #26C6DA
inactive_border_color   #3E5060
bell_border_color       #F9E2AF

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #0F1117
active_tab_background   #26C6DA
inactive_tab_foreground #C0F0ED
inactive_tab_background #10121A
tab_bar_background      #0F1117

# Colors for marks (marked text in the terminal)
mark1_foreground #0F1117
mark1_background #26C6DA
mark2_foreground #0F1117
mark2_background #1ABC9C
mark3_foreground #0F1117
mark3_background #4DD0E1

