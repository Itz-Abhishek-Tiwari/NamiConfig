# The basic colors
foreground              #4C5C69
background              #EDF2F4
selection_foreground    #EDF2F4
selection_background    #1ABC9C

# Cursor colors
cursor                  #1ABC9C
cursor_text_color       #EDF2F4

# URL underline color when hovering with mouse
